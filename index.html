<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Bunny Tools – Calculator & Unit Converter</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="app-title">
      <span class="logo">🐰</span>
      <div>
        <h1>Bunny Tools</h1>
        <p>Calculator & Unit Converter</p>
      </div>
    </div>
  </header>

  <main class="app-main">
    <nav class="tabs" aria-label="Tool selection">
      <button class="tab active" data-tab="calculator" type="button">
        Calculator
      </button>
      <button class="tab" data-tab="converter" type="button">
        Unit Converter
      </button>
    </nav>

    <!-- Calculator Panel -->
    <section id="calculator" class="panel active" aria-label="Calculator">
      <div class="calc-container">
        <input
          id="calc-display"
          class="calc-display"
          type="text"
          inputmode="decimal"
          aria-label="Calculator input"
        />

        <div class="calc-grid" aria-label="Calculator buttons">
          <button data-key="C">C</button>
          <button data-key="(">(</button>
          <button data-key=")">)</button>
          <button data-key="/" class="op">÷</button>

          <button data-key="7">7</button>
          <button data-key="8">8</button>
          <button data-key="9">9</button>
          <button data-key="*" class="op">×</button>

          <button data-key="4">4</button>
          <button data-key="5">5</button>
          <button data-key="6">6</button>
          <button data-key="-" class="op">−</button>

          <button data-key="1">1</button>
          <button data-key="2">2</button>
          <button data-key="3">3</button>
          <button data-key="+" class="op">+</button>

          <button data-key="0" class="wide">0</button>
          <button data-key=".">.</button>
          <button data-key="=" class="equals">=</button>
        </div>

        <p class="calc-hint">
          Tip: You can type with your keyboard and press Enter to calculate.
        </p>
      </div>
    </section>

    <!-- Unit Converter Panel -->
    <section id="converter" class="panel" aria-label="Unit converter">
      <div class="converter-container">
        <div class="converter-row">
          <label for="conv-category">Category</label>
          <select id="conv-category"></select>
        </div>

        <div class="converter-row">
          <label for="conv-value">Value</label>
          <input
            id="conv-value"
            type="number"
            inputmode="decimal"
            aria-label="Value to convert"
          />
        </div>

        <div class="converter-row">
          <label for="conv-from">From</label>
          <select id="conv-from"></select>
        </div>

        <div class="converter-row">
          <label for="conv-to">To</label>
          <select id="conv-to"></select>
        </div>

        <button id="conv-btn" type="button" class="primary-btn">
          Convert
        </button>

        <output id="conv-result" aria-live="polite" class="conv-result"></output>
      </div>
    </section>
  </main>

  <footer class="app-footer">
    <span>Made with care by Bunny</span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
